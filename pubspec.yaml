name: obsidian_todo
description: Animated minimal productivity & collaborative to-do app (Obsidian Pulse / Obsidian Apple Precision).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  app_links: ^6.1.4
  flutter_web_auth_2: ^5.0.3
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
dependency_overrides:
  flutter_web_auth_2: ^5.0.3